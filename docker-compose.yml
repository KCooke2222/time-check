# Development stack for Time Check.
#
# Every secret comes from the root .env (see .env.example). Nothing sensitive is
# written into this file: the Postgres credentials below are interpolated from
# .env at `docker compose` time, they are not values stored here.
#
# Host ports: frontend 5173, backend 5000, postgres 5434.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 5434 on the host: 5432 is usually taken by a locally installed Postgres,
      # and 5433 by other local Compose stacks. Override with POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # `localhost` inside a container is the container itself, so the .env
      # DATABASE_URL cannot be used as-is. Rebuilt here from the same
      # credentials, pointing at the `postgres` service.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      # Bind mount for hot reload; anonymous volume keeps a host .venv from
      # shadowing the image's site-packages.
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/auth/status')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      # Bind mount for hot reload; anonymous volume keeps the host node_modules
      # from shadowing the one installed in the image.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
