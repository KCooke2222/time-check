# Development stack for Time Check.
#
# There is no bundled database. The containers connect out to the Postgres
# already running on the host — the same `time_track` database ./start-dev.sh
# uses — so the Docker and native paths can never diverge.
#
# Every secret comes from the root .env (see .env.example). Nothing sensitive is
# written into this file: the Postgres credentials below are interpolated from
# .env at `docker compose` time, they are not values stored here. Only the
# backend loads the whole .env; the frontend gets just the one variable it uses.
#
# Host ports: frontend 5173, backend 5000, both bound to 127.0.0.1 only.
# FRONTEND_HOST_PORT moves the frontend, as long as CORS_ORIGINS names the new
# origin: the OAuth callback redirect follows it. The browser only talks to the
# frontend; Vite proxies /api to the backend container.
#
# First-time setup requires one change on the host, outside this repo: the host
# Postgres must accept connections from this stack's subnet. See README.md.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # `localhost` inside a container is the container itself, so the .env
      # DATABASE_URL cannot be used as-is. Rebuilt here from the same
      # credentials, pointing at the host via the gateway address below.
      #
      # The three credential parts are required rather than defaulted: an
      # upgraded .env that only carries DATABASE_URL would otherwise build
      # `postgresql://:@host.docker.internal:5432/` and fail as a confusing
      # auth error in a restart loop instead of failing here.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env, matching DATABASE_URL}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, matching DATABASE_URL}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?set POSTGRES_DB in .env, matching DATABASE_URL}
    extra_hosts:
      # Required on Linux: host.docker.internal does not resolve without it.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      # Bind mount for hot reload; anonymous volume keeps a host .venv from
      # shadowing the image's site-packages.
      - ./backend:/app
      - /app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/auth/status')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Deliberately narrowed instead of loading the whole .env: the backend's
      # secrets have no reason to exist in this container's environment.
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      VITE_PROXY_TARGET: http://backend:5000
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      # Bind mount for hot reload; anonymous volume keeps the host node_modules
      # from shadowing the one installed in the image.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  default:
    # Pinned so the host's pg_hba.conf rule can name an exact, stable subnet
    # instead of granting Docker's whole 172.16.0.0/12 range. Declaring it also
    # reserves it against Docker's auto-allocation.
    ipam:
      config:
        - subnet: 172.31.250.0/24
